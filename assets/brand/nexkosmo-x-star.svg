<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Nexkosmo X Star</title>
  <desc id="desc">Canonical Nexkosmo X mark in violet and lilac with a bright white-violet intelligence star and horizontal light streak at the centre.</desc>
  <defs>
    <linearGradient id="armGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6424F5"/>
      <stop offset="0.58" stop-color="#8B3DFF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <radialGradient id="starGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#F7ECFF"/>
      <stop offset="0.55" stop-color="#DCA8FF"/>
      <stop offset="1" stop-color="#8A3DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="armGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Four separated arms preserve the Nexkosmo X silhouette. -->
  <g fill="url(#armGradient)" filter="url(#armGlow)">
    <rect x="45" y="32" width="34" height="104" rx="17" transform="rotate(-45 62 84)"/>
    <rect x="177" y="32" width="34" height="104" rx="17" transform="rotate(45 194 84)"/>
    <rect x="45" y="120" width="34" height="104" rx="17" transform="rotate(45 62 172)"/>
    <rect x="177" y="120" width="34" height="104" rx="17" transform="rotate(-45 194 172)"/>
  </g>

  <!-- Progression-bar inspired intelligence streak. -->
  <g filter="url(#starGlow)">
    <rect x="32" y="126.5" width="192" height="3" rx="1.5" fill="#A64FFF" opacity="0.42"/>
    <rect x="57" y="127.25" width="142" height="1.5" rx="0.75" fill="#F1D7FF" opacity="0.7"/>
    <rect x="127.1" y="66" width="1.8" height="124" rx="0.9" fill="#BE75FF" opacity="0.45"/>

    <!-- Central star: intelligence coming alive. -->
    <circle cx="128" cy="128" r="22" fill="url(#starGradient)" opacity="0.95"/>
    <path d="M128 106 C130 119 137 126 150 128 C137 130 130 137 128 150 C126 137 119 130 106 128 C119 126 126 119 128 106 Z" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="4" fill="#FFFFFF"/>
  </g>
</svg>
