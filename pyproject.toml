[project]
name = "nexkosmo-semantic-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.0.0,<12",
]

[project.scripts]
nexkosmo-asset-process = "nexkosmo.asset_processing:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
