name: Import Horse Racing 3D Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-horse-racing-3d-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexkosmo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source 3D assets
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ChrisTOMO2011/HorseRacingTRRepo.git /tmp/HorseRacingTRRepo
          cd /tmp/HorseRacingTRRepo
          git sparse-checkout set 3D_ASSETS

      - name: Copy assets into Nexkosmo
        run: |
          mkdir -p assets/3d-models/HorseRacingTRRepo
          rsync -a --delete /tmp/HorseRacingTRRepo/3D_ASSETS/ assets/3d-models/HorseRacingTRRepo/

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d-models/HorseRacingTRRepo
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "feat(assets): import HorseRacingTRRepo 3D assets"
          git push origin main
