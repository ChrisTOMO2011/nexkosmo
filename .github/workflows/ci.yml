name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check app tests scripts/verify_migration_head.py
      - run: ruff format --check app tests scripts/verify_migration_head.py
      - run: mypy app
      - run: python -m compileall -q app migrations tests
      - name: Prepare integration environment
        run: cp .env.example .env
      - name: Run mandatory PostgreSQL migration, repository, and RLS acceptance
        run: docker compose up --build --abort-on-container-exit --exit-code-from test test
      - name: Verify Alembic source and database heads agree
        run: docker compose run --rm migrate python -m scripts.verify_migration_head
      - name: Development backup and restore rehearsal
        run: docker compose run --rm restore-test
      - name: Require a clean generated/formatting diff
        run: git diff --exit-code

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Require a clean frontend build diff
        run: git diff --exit-code
